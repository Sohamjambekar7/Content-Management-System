services:
  mysql:
    image: mysql:8.0
    container_name: easecontent-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-easecontent}
      MYSQL_USER: ${DB_USER:-easecontent_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-easecontent_change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-easecontent_root_change_me}
    ports:
      - "${DB_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: easecontent-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    container_name: easecontent-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      SERVICE_NAME: easecontent-api
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-easecontent}
      DB_USER: ${DB_USER:-easecontent_user}
      DB_PASSWORD: ${DB_PASSWORD:-easecontent_change_me}
      DB_AUTO_SYNC: ${DB_AUTO_SYNC:-true}
      REDIS_URL: redis://redis:6379
      MEDIA_STORAGE_DIR: /app/storage/media
      JWT_SECRET: ${JWT_SECRET:-replace_this_with_a_strong_random_secret_at_least_32_chars}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-replace_this_with_a_strong_32_char_encryption_key}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8080}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-EASEContent <onboarding@resend.dev>}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/youtube/callback}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_HOST_PORT:-5000}:5000"
    volumes:
      - media_storage:/app/storage/media
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    container_name: easecontent-worker
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      SERVICE_NAME: easecontent-worker
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-easecontent}
      DB_USER: ${DB_USER:-easecontent_user}
      DB_PASSWORD: ${DB_PASSWORD:-easecontent_change_me}
      REDIS_URL: redis://redis:6379
      MEDIA_STORAGE_DIR: /app/storage/media
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      FFMPEG_PRESET: ${FFMPEG_PRESET:-veryfast}
      FFMPEG_CRF: ${FFMPEG_CRF:-23}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - media_storage:/app/storage/media
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_API_URL: ${PUBLIC_API_URL:-}
    container_name: easecontent-web
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  media_storage:
