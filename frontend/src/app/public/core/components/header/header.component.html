<header class="sticky top-0 z-20 border-b border-slate-200 bg-white/95 backdrop-blur">
  <div class="page-container flex h-16 items-center justify-between gap-4">
    <a routerLink="/" class="flex items-center gap-2 text-xl font-extrabold tracking-tight text-slate-900"><span class="flex h-9 w-9 items-center justify-center rounded-xl bg-indigo-600 text-white">C</span>Content<span class="-ml-2 text-indigo-600">Desk</span></a>
    <nav class="flex items-center gap-3 text-sm font-semibold text-slate-600 sm:gap-6" aria-label="Main navigation">
      <a routerLink="/" class="transition hover:text-indigo-700">Explore</a>
      @if (!authService.session) {
        <a routerLink="/auth/login" class="cms-button !min-h-10 !px-4">Sign in</a>
      } @else {
        <a routerLink="/admin" class="transition hover:text-indigo-700">Dashboard</a>
        <button class="rounded-lg border border-slate-200 px-3 py-2 transition hover:bg-slate-50" (click)="authService.logout()">Sign out</button>
      }
    </nav>
  </div>
</header>
