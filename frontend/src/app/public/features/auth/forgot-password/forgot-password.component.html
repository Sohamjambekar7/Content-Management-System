<form (ngSubmit)="submit()" class="card" [formGroup]="form">
    <h1 class="!mb-2 !text-left !text-2xl">Reset your password</h1>
    <p class="!mb-5 !text-sm !text-slate-500">Enter your account email and we’ll send reset instructions.</p>
    @if (message) { <div role="status" class="mb-4 rounded-lg border border-emerald-200 bg-emerald-50 px-3 py-2 text-sm text-emerald-700">{{message}}</div> }
    @if (errorMessage) { <div role="alert" class="mb-4 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">{{errorMessage}}</div> }
    <div>
        <label for="email">Email</label>
        <input formControlName="email" type="email" id="email" name="email" placeholder="Email">
    </div>



    <div class="flex justify-end mt-5">
        <button [disabled]="!form.valid || isSubmitting" type="submit">{{isSubmitting ? 'Sending…' : 'Send reset link'}}</button>

    </div>

   


</form>
