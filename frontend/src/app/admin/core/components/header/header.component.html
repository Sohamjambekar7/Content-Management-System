<mat-toolbar class="!h-16 !bg-white !text-slate-800 !border-b !border-slate-200 !shadow-sm flex justify-between">
  <div class="flex items-center gap-3">
    <button mat-icon-button aria-label="Toggle navigation" (click)="toggleBtnClicked.emit()"><mat-icon>menu</mat-icon></button>
    <a routerLink="/admin" class="flex items-center gap-2 text-lg font-extrabold tracking-tight text-slate-900 no-underline">
      <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-gradient-to-br from-indigo-600 to-violet-600 text-xs font-black text-white">EC</span>
      <span>EASE<span class="text-indigo-600">Content</span></span>
    </a>
    <span class="hidden sm:inline text-xs font-semibold uppercase tracking-widest text-slate-400 ml-1">Workspace</span>
  </div>
  <div class="flex items-center gap-3">
    <a routerLink="/editor" class="hidden sm:inline-flex items-center gap-1.5 rounded-xl bg-indigo-600 px-3.5 py-2 text-xs font-semibold text-white no-underline shadow-sm transition hover:bg-indigo-700">
      <span>✦</span><span>Open Creative Studio</span>
    </a>
    <div class="hidden md:flex flex-col text-right leading-tight">
      <span class="text-xs font-semibold text-slate-700">{{authService.session?.user?.name}}</span>
      <span class="text-[11px] text-slate-400">{{authService.session?.user?.email}}</span>
    </div>
    <button mat-icon-button aria-label="Sign out" title="Sign out" (click)="authService.logout()"><mat-icon>logout</mat-icon></button>
  </div>
</mat-toolbar>
