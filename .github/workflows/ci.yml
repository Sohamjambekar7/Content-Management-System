name: EASEContent CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Lint, Typecheck, Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install FFmpeg for media pipeline tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install backend dependencies
        run: npm ci

      - name: Typecheck & lint backend
        run: npm run lint

      - name: Build backend TypeScript
        run: npm run build

      - name: Run backend test suite
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_jwt_secret_key_for_easecontent_at_least_32_chars
        run: npm test

  frontend-ci:
    name: Frontend Build & Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        env:
          npm_config_onnxruntime_node_install_cuda: "skip"
          ONNXRUNTIME_NODE_INSTALL_CUDA: "skip"
        run: npm ci --onnxruntime-node-install-cuda=skip

      - name: Typecheck Angular project
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build Angular production bundle
        run: npm run build

  docker-build-validation:
    name: Validate Docker Images & Compose
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml syntax
        run: docker compose --env-file .env.example config -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: api
          push: false
          tags: easecontent-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Media Worker Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: worker
          push: false
          tags: easecontent-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: easecontent-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
